version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whatsapp_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: whatsapp_crm
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d whatsapp_crm']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: whatsapp_crm_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/whatsapp_crm?schema=public
      JWT_SECRET: super-secure-jwt-production-secret-replace-me
      JWT_EXPIRES_IN: 7d
      WHATSAPP_PROVIDER: mock
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:-}
      META_PHONE_NUMBER_ID: ${META_PHONE_NUMBER_ID:-}
      META_BUSINESS_ACCOUNT_ID: ${META_BUSINESS_ACCOUNT_ID:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-whatsapp_webhook_secret_token_123}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: whatsapp_crm_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
